<img [src]="imageSrc()" [attr.srcset]="imageSrcset() || null"
  sizes="(min-width: 64em) 50vw, 100vw" [alt]="imageAlt()"
  fetchpriority="high" width="640" height="360" class="min-w-0 flex-1 object-cover rounded w-full" />

<div class="flex-1 flex flex-col gap-4">
  <ui-date [datetime]="datetime()"></ui-date>

  <h2 [id]="featureTitleId" class="text-medium font-bold text-2xl leading-tight">
    {{ title() }}
  </h2>

  <p class="text-medium">
    {{ description() }}
  </p>

  <a uiButton [routerLink]="ctaRoute()" class="self-end mt-auto" [attr.aria-labelledby]="featureTitleId">
    {{ ctaLabel() }}
  </a>
</div>
