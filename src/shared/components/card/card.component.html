<div class="flex relative rounded overflow-hidden">
  <img [src]="imageSrc()" [attr.srcset]="imageSrcset() || null"
    sizes="(min-width: 64em) 33vw, (min-width: 48em) 50vw, 100vw"
    [alt]="imageAlt()" loading="lazy" width="600"
    height="338"
    class="flex-1 object-cover transition-transform duration-300 group-hover:scale-105" />
</div>

<div class="flex flex-col gap-4">
  <ui-date [datetime]="datetime()" />

  <h3 class="text-2xl font-bold text-high leading-tight">
    @if (route()) {
    <a [routerLink]="route()" class="after:absolute after:inset-0 focus-visible:outline-none">
      {{ title() }}
    </a>
    } @else {
    {{ title() }}
    }
  </h3>

  <p class="text-base text-medium line-clamp-6">
    {{ description() }}
  </p>
</div>
