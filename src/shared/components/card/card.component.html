<div class="relative rounded overflow-hidden aspect-video">
  <img [src]="imageSrc()" [alt]="imageAlt()" class="w-full h-full object-cover" />
</div>
<div class="flex flex-col gap-4">
  <ui-date [datetime]="datetime()"></ui-date>
  <h1 class="text-xl font-bold text-text-high">{{ title() }}</h1>
  <h2 class="text-base font-medium text-text-medium line-clamp-6">{{ description() }}</h2>
</div>
